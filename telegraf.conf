[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  # ไม่ติด tag host มากับข้อมูล เพราะใน container ค่านี้คือ container ID
  # ซึ่งเปลี่ยนทุกครั้งที่สร้าง container ใหม่ ทำให้ InfluxDB มองเป็นคนละ series
  # กราฟจะขาดเป็นท่อนและโมเดล ML จะเห็นข้อมูลแตกเป็นหลายก้อน
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["traffic/6620301002"]
  data_format = "json"
  # ไม่ตั้งชื่อ measurement จะกลายเป็น mqtt_consumer ตาม default
  # ต่อท้ายด้วยรหัสนักศึกษาตามคอนเวนชันที่ทั้งห้องใช้ใน bucket กลาง
  name_override = "traffic_6620301002"
  # parser json ทิ้งค่า string ทุกตัวที่ไม่ระบุตรงนี้ ถ้าไม่ใส่ camera_id
  # กับ student_id จะหายไปทั้งคู่ จนแยกไม่ออกว่าข้อมูลเป็นของใคร
  tag_keys = ["camera_id", "student_id"]
  # ใช้เวลาที่กล้องตรวจจับ ไม่ใช่เวลาที่ Telegraf ได้รับข้อความ
  json_time_key = "timestamp"
  json_time_format = "RFC3339"

[[outputs.influxdb_v2]]
  urls = ["http://172.16.2.117:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "my-org"
  bucket = "mini_project"

[[outputs.kafka]]
  brokers = ["kafka:29092"]
  topic = "traffic-events"
  data_format = "json"

[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  # ไม่ติด tag host มากับข้อมูล เพราะใน container ค่านี้คือ container ID
  # ซึ่งเปลี่ยนทุกครั้งที่สร้าง container ใหม่ ทำให้ InfluxDB มองเป็นคนละ series
  # กราฟจะขาดเป็นท่อนและโมเดล ML จะเห็นข้อมูลแตกเป็นหลายก้อน
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["traffic/6620301002"]
  data_format = "json"
  # ไม่ตั้งชื่อ measurement จะกลายเป็น mqtt_consumer ตาม default
  # ต่อท้ายด้วยรหัสนักศึกษาตามคอนเวนชันที่ทั้งห้องใช้ใน bucket กลาง
  name_override = "traffic_6620301002"
  # parser json ทิ้งค่า string ทุกตัวที่ไม่ระบุตรงนี้ ถ้าไม่ใส่ camera_id
  # กับ student_id จะหายไปทั้งคู่ จนแยกไม่ออกว่าข้อมูลเป็นของใคร
  tag_keys = ["camera_id", "student_id"]
  # ใช้เวลาที่กล้องตรวจจับ ไม่ใช่เวลาที่ Telegraf ได้รับข้อความ
  json_time_key = "timestamp"
  json_time_format = "RFC3339"

[[outputs.influxdb_v2]]
  urls = ["http://172.16.2.117:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "my-org"
  bucket = "mini_project"

[[outputs.kafka]]
  # Kafka ของวิชา ต่อตรงจากเครื่องเราได้ตั้งแต่ 2026-09-09 ที่อาจารย์แก้
  # advertised.listeners จาก localhost:9092 เป็น 172.16.2.117:9092
  # ก่อนหน้านั้นเครื่องอื่นต่อไม่ได้ ต้องอ้อมผ่าน MQTT แล้วให้ Kafka Connect ดึงเข้า
  brokers = ["172.16.2.117:9092"]
  topic = "traffic-events-6620301002"
  data_format = "json"
  # ค่าเริ่มต้นของ Telegraf จะห่อข้อมูลเป็น {"fields":{...},"tags":{...},"name":...}
  # แปลงกลับให้แบนราบเหมือน payload ที่ testmqtt.py ส่งขึ้น MQTT
  # เพื่อให้ผู้อ่านปลายทางแกะข้อมูลแบบเดียวกันได้ทั้งจาก MQTT และ Kafka
  json_timestamp_format = "2006-01-02T15:04:05Z07:00"
  json_transformation = '''
  {
    "timestamp": timestamp,
    "camera_id": tags.camera_id,
    "student_id": tags.student_id,
    "car": fields.car,
    "motorcycle": fields.motorcycle,
    "bus": fields.bus,
    "truck": fields.truck,
    "vehicles_in_roi": fields.vehicles_in_roi,
    "slow_vehicle_ratio": fields.slow_vehicle_ratio,
    "congestion_level": fields.congestion_level
  }
  '''
